name: YoXo Newsroom Autonomous Cloud Dispatcher

on:
  schedule:
    # Runs every 10 minutes automatically 24/7/365 in GitHub Cloud ($0, no card needed)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows 1-click manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

concurrency:
  group: newsroom-exclusive-lock
  cancel-in-progress: true

jobs:
  newsroom-cycle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Restore X Session Cookies
        run: |
          if [ -n "${{ secrets.X_SESSION_COOKIES }}" ]; then
            echo '${{ secrets.X_SESSION_COOKIES }}' > x_session.json
            echo "✅ Restored X session cookies for @YoXo_Station"
          fi

      - name: Run Editorial Newsroom Cycle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: node yoxo_newsroom.js

      - name: Persist History to Prevent Duplicate Stories
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for file in history.json history_headlines.json last_style.txt last_x_post.json last_x_comment.json commented_tweets.json; do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "chore: update editorial history [skip ci]"
            git pull --rebase origin main || true
            git push origin main || true
          fi

